# pull_request_target is kept on purpose: it is the only trigger that gives PRs from forks a
# token that can write labels. No PR code is checked out or run; the labeler config is read
# through the API at the base commit (GITHUB_SHA), not from the PR.
name: "Issue Labeler"
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: AlexanderWert/issue-labeler@32be4a3c3d8f009c2741af471994337c34b4cb6f # v2.3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        configuration-path: .github/labeler-config.yml
        enable-versioned-regex: 0
